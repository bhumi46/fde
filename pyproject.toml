[project]
name = "acme"
version = "0.1.0"
description = "FDE learning project: Acme Logistics simulated customer engagement"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "pandas",
    "pydantic>=2",
    "python-dotenv",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
